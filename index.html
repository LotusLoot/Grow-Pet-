<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>펫 부화장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 폰 화면 하나짜리 게임 창. 위 자원 바 · 가운데 장면 · 아래 탭바. 만화풍 굵은 테두리, 하늘과 풀밭. 한 가지 밝은 룩으로 고정. */
:root{
  color-scheme:light;
  --sky1:#7FD0FF; --sky2:#CFF1FF; --meadow:#9AD86A; --meadow2:#78C24E;
  --ink:#24305E; --paper:#FFFFFF; --paper2:#EEF4FF; --muted:#66729E;
  --yolk:#FFC633; --coral:#FF6B6B; --mint:#25C29B; --sea:#3D8BFF;
  --r0:#B7C1D6; --r1:#5ACB7D; --r2:#4AA3FF; --r3:#A27BFF; --r4:#FF9A35;
  --grass:#3FA35B; --fire:#EE6231; --water:#2A86D6; --wind:#2FB0C7; --star:#6B5BD6;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --line:2.5px solid var(--ink); --pop:0 4px 0 var(--ink);
}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,#E9FBEF);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky1)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:10px 8px;background:linear-gradient(180deg,var(--sky1) 70%,rgba(127,208,255,0))}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:6px;color:var(--ink);text-shadow:0 2px 0 #fff}
.iconbtns{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--paper);border:var(--line);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;position:relative;padding:0}
.ibtn svg{width:22px;height:22px}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.res{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.res::-webkit-scrollbar{display:none}
.rp{flex:none;display:inline-flex;align-items:center;gap:5px;background:rgba(36,48,94,.82);color:#fff;border-radius:999px;padding:3px 10px 3px 3px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;border:0}
.it{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-size:12px;color:#fff;flex:none;border:2px solid rgba(255,255,255,.85)}
.it.gold{background:radial-gradient(circle at 35% 35%,#FFE680,#F2A500);color:#7A4A00}
.it.food{background:radial-gradient(circle at 35% 35%,#C8F08A,#5FAF2E)}
.it.prem{background:radial-gradient(circle at 35% 35%,#FFC98A,#D9742B)}
.it.awaken{background:radial-gradient(circle at 35% 35%,#9FD4FF,#2E6FE0);border-radius:6px;transform:rotate(45deg)}
.it.trans{background:conic-gradient(#FF7AD9,#B26BFF,#6BC8FF,#FFE36B,#FF7AD9);border-radius:6px;transform:rotate(45deg)}
.it.awaken span,.it.trans span{transform:rotate(-45deg)}
.it.inc0{background:radial-gradient(circle at 35% 35%,#E6ECF7,#7C8AA5)}
.it.inc1{background:radial-gradient(circle at 35% 35%,#C9F3FF,#3D8BFF)}.it.inc2{background:radial-gradient(circle at 35% 35%,#FFF0A6,#F2A500)}
.it.big{width:44px;height:44px;font-size:20px;border-width:3px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--paper);border-top:var(--line)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{border:0;background:transparent;border-radius:14px;padding:6px 0 4px;display:grid;justify-items:center;gap:1px;font-family:var(--display);font-size:13px;color:var(--muted);position:relative}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{background:var(--yolk);color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink)}
.dot{position:absolute;top:2px;right:calc(50% - 20px);width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.ibtn .dot{top:-4px;right:-4px}
.view{display:grid;gap:14px;margin-top:6px}
.card{background:var(--paper);border:var(--line);border-radius:20px;box-shadow:var(--pop);padding:14px;min-width:0}
.card.flat{box-shadow:none}
.h{font-family:var(--display);font-size:20px;margin:0;line-height:1.2;font-weight:400}
.sub{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:var(--line);border-radius:14px;padding:8px 16px;background:var(--yolk);font-family:var(--display);font-size:16px;box-shadow:0 4px 0 var(--ink);transition:transform .06s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.blue{background:var(--sea);color:#fff}.btn.green{background:var(--mint);color:#fff}.btn.red{background:var(--coral);color:#fff}.btn.white{background:var(--paper)}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn.lg{padding:12px 22px;font-size:20px;border-radius:16px}
.btn[disabled]{background:#D7DDEA;color:#8A94B3;cursor:not-allowed;transform:none;box-shadow:0 3px 0 #9BA6C4;border-color:#9BA6C4}
.seg{display:inline-flex;background:var(--paper2);border:var(--line);border-radius:14px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:10px;font-family:var(--display);font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-family:var(--display);border-radius:999px;padding:1px 9px;background:var(--paper2);border:2px solid var(--ink);white-space:nowrap}
.elb{display:inline-block;font-size:11.5px;font-family:var(--display);color:#fff;padding:0 8px;border-radius:999px;border:2px solid var(--ink)}
.el-grass{background:var(--grass)}.el-fire{background:var(--fire)}.el-water{background:var(--water)}.el-wind{background:var(--wind)}.el-star{background:var(--star)}
.mono{font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--paper2);border-radius:99px;overflow:hidden;border:2px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--yolk);transition:width .35s}
.empty{color:var(--muted);text-align:center;padding:18px;border:2.5px dashed #B9C3DD;border-radius:16px;background:rgba(255,255,255,.6)}
.sprite{width:100%;aspect-ratio:1;max-width:100%;object-fit:contain;display:block;margin:0 auto;-webkit-user-drag:none;user-select:none}
.flip{transform:scaleX(-1)}
.v-gold{filter:sepia(1) saturate(3.2) hue-rotate(-8deg) brightness(1.08) drop-shadow(0 0 6px rgba(255,200,40,.9))}
.v-rainbow{animation:rb 4s linear infinite}
@keyframes rb{0%{filter:hue-rotate(0) saturate(1.5) drop-shadow(0 0 6px #ff7ad9)}100%{filter:hue-rotate(360deg) saturate(1.5) drop-shadow(0 0 6px #7affe1)}}
.v-shadow{filter:brightness(.45) saturate(1.8) hue-rotate(220deg) drop-shadow(0 0 7px rgba(170,90,255,.95))}
.sil{filter:brightness(0) opacity(.22)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.pc{position:relative;border:0;padding:3px;border-radius:18px;background:var(--rc,var(--r0));box-shadow:0 4px 0 var(--ink);display:block;min-width:0;text-align:center}
.pc .in{background:linear-gradient(180deg,#fff,var(--paper2));border-radius:15px;border:2px solid var(--ink);padding:4px 4px 6px;display:grid;gap:1px;height:100%;position:relative}
.pc .nm{font-family:var(--display);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pw{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .tl{position:absolute;top:5px;left:5px;z-index:1}
.pc .tr{position:absolute;top:5px;right:5px;font-size:10.5px;z-index:1;padding:0 6px}
.pc .st{display:flex;justify-content:center;gap:2px;margin-top:-4px}
.pc .st i{width:7px;height:7px;border-radius:50%;background:#D4DAE8;border:1.5px solid var(--ink)}
.pc .st i.on{background:var(--yolk)}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}
.r5{--rc:conic-gradient(from 0deg,#FF6B9A,#FFC633,#5ACB7D,#4AA3FF,#A27BFF,#FF6B9A)}
.r5 .in{background:linear-gradient(180deg,#FFF8E1,#FFE9F4)}
.scene{position:relative;height:270px;border-radius:24px;border:var(--line);box-shadow:var(--pop);overflow:hidden;background:linear-gradient(180deg,#9EE0FF 0%,#D4F4FF 52%,var(--meadow) 52%,var(--meadow2) 100%)}
.scene .sun{position:absolute;right:22px;top:16px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#FFF4B0,#FFD24A);box-shadow:0 0 30px #FFE68A}
.cloud{position:absolute;left:0;height:22px;background:#fff;border-radius:20px;opacity:.9;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:26px;height:26px;left:10px;top:-12px}.cloud::after{width:20px;height:20px;left:30px;top:-8px}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(620px)}}
.walker{position:absolute;bottom:14px;width:82px;height:82px;transition:left 3s ease-in-out;z-index:2;border:0;background:transparent;padding:0}
.walker .bob{width:100%;height:100%;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.walker .shadowo{position:absolute;bottom:-3px;left:18%;width:64%;height:9px;border-radius:50%;background:rgba(36,48,94,.18);z-index:-1}
.walker.sulk::after{content:"흥!";position:absolute;top:-8px;right:-2px;font-family:var(--display);font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 5px}
.collect{position:absolute;left:50%;top:56px;z-index:4;display:flex;align-items:center;gap:8px;background:var(--paper);border:var(--line);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:var(--pop);font-family:var(--display);font-size:17px;animation:pulse 1.6s ease-in-out infinite;white-space:nowrap;transform:translateX(-50%)}
.collect.full{background:#FFF1C2}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.scene .rate{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:12px;padding:2px 9px;font-size:12.5px;font-family:var(--display);z-index:3}
.scene .cap{position:absolute;left:12px;bottom:10px;z-index:3;width:110px}
.coinfly{position:fixed;z-index:40;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translateY(-80px) scale(.6);opacity:0}}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qc{background:var(--paper);border:var(--line);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:9px 8px;display:grid;gap:4px;text-align:center;position:relative;min-width:0;align-content:space-between}
.qc .t{font-family:var(--display);font-size:15px}
.qc .s{font-size:11.5px;color:var(--muted)}
.guide{display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 #101634;border:0;text-align:left;width:100%}
.guide .gi{width:36px;height:36px;border-radius:12px;background:var(--yolk);display:grid;place-items:center;font-family:var(--display);color:var(--ink);flex:none;font-size:18px}
.guide .gt{flex:1;min-width:0;font-size:13.5px;color:#C9D2F2}.guide .gt b{font-family:var(--display);font-weight:400;display:block;font-size:16px;color:#fff}
.eggs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.eggcard{flex:none;width:104px;background:var(--paper2);border:var(--line);border-radius:18px;padding:8px;text-align:center;display:grid;gap:4px}
.eggshape{width:58px;height:72px;border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;margin:2px auto;position:relative;border:2.5px solid var(--ink);box-shadow:inset -7px -9px 0 rgba(0,0,0,.12),inset 5px 5px 0 rgba(255,255,255,.45)}
.egg-grass{background:radial-gradient(circle at 35% 35%,#D5F7C2,#5DB86A)}.egg-fire{background:radial-gradient(circle at 35% 35%,#FFD9B0,#E8562B)}.egg-water{background:radial-gradient(circle at 35% 35%,#C8EAFF,#2C7FCF)}.egg-wind{background:radial-gradient(circle at 35% 35%,#FFFFFF,#8FD3E6)}.egg-star{background:radial-gradient(circle at 35% 35%,#C8BFFF,#2C2470)}
.eggshape::after{content:"";position:absolute;left:24%;top:46%;width:52%;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 8px,transparent 8px 14px);border-radius:4px}
.wobble{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-2deg)}}
.list{display:grid;gap:10px}
.li{display:flex;align-items:center;gap:12px;background:var(--paper);border:var(--line);border-radius:18px;box-shadow:0 3px 0 var(--ink);padding:10px 12px;min-width:0;width:100%}
.li .grow{flex:1;min-width:0}
.li .t{font-family:var(--display);font-size:17px}
.li.locked{background:#E4E9F3}
.li[disabled]{opacity:.5}
.thumb{width:58px;height:58px;flex:none}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.slot{width:54px;height:54px;border:2.5px dashed #9AA6C6;border-radius:14px;display:grid;place-items:center;color:#8C98BA;font-size:22px;font-family:var(--display);background:var(--paper2);flex:none;padding:0}
.slotpet{width:54px;height:54px;border-radius:14px;background:var(--paper2);border:2.5px solid var(--ink);padding:2px;position:relative;flex:none}
.slotpet img{width:100%;height:100%;object-fit:contain}
.scrim{position:fixed;inset:0;background:rgba(20,26,56,.6);z-index:20;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);width:min(500px,100%);max-height:calc(100% - 24px);overflow:auto;padding:16px;animation:popin .2s ease-out}
@keyframes popin{from{transform:scale(.92);opacity:0}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:36px;height:36px;border-radius:12px;border:var(--line);background:var(--paper2);font-family:var(--display);font-size:18px;padding:0;flex:none}
.stage-bg{position:relative;border-radius:20px;border:var(--line);overflow:hidden;background:radial-gradient(circle at 50% 60%,#FFFFFF,#DDEBFF);display:grid;place-items:center;padding:8px}
.stage-bg.r5{background:radial-gradient(circle at 50% 60%,#FFFDF0,#FFE1F1)}
.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,214,90,.35) 0 10deg,transparent 10deg 20deg);animation:spin 8s linear infinite;pointer-events:none}
.rays.gold{background:repeating-conic-gradient(rgba(255,196,0,.55) 0 10deg,transparent 10deg 20deg)}
.rays.rainbow{background:repeating-conic-gradient(rgba(255,122,217,.45) 0 8deg,rgba(122,255,225,.45) 8deg 16deg,transparent 16deg 24deg)}
.rays.shadow{background:repeating-conic-gradient(rgba(140,70,255,.5) 0 10deg,transparent 10deg 20deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero{width:min(200px,60vw);position:relative;z-index:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.statrow div{background:var(--paper2);border:2px solid var(--ink);border-radius:12px;padding:5px 8px;font-size:11.5px;color:var(--muted);min-width:0}
.statrow b{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--ink)}
.enh{background:var(--paper2);border:2px solid var(--ink);border-radius:16px;padding:12px;display:grid;gap:8px;margin-top:12px}
.cost{display:flex;gap:6px;flex-wrap:wrap}
.cchip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 9px 2px 2px;font-family:var(--display);font-size:14px}
.cchip.short{border-color:var(--coral);color:var(--coral)}
.looks{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.looks button{background:var(--paper2);border:2.5px solid #C5CDE0;border-radius:12px;padding:2px}
.looks button[aria-pressed="true"]{border-color:var(--ink);background:var(--yolk)}
.looks button[disabled]{cursor:not-allowed}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.reward{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.rt{width:78px;background:var(--paper2);border:2.5px solid var(--ink);border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:4px;animation:pop .4s backwards}
.rt b{font-family:var(--display);font-weight:400;font-size:16px}
.rt span.n{font-size:11px;color:var(--muted)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.bigtitle{font-family:var(--display);font-size:34px;text-align:center;margin:4px 0 0;color:var(--ink);text-shadow:0 3px 0 var(--yolk)}
.bigtitle.lose{text-shadow:0 3px 0 #C5CDE0}
.gauge{height:18px;border-radius:99px;border:2.5px solid var(--ink);background:#fff;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yolk),var(--coral));animation:charge .9s ease-in forwards}
@keyframes charge{to{width:100%}}
.glow{animation:glow .9s ease-in-out}
@keyframes glow{50%{filter:brightness(1.8) drop-shadow(0 0 16px #FFD24A)}}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.crack{animation:crk .7s ease-in-out}
@keyframes crk{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.05)}50%{transform:rotate(12deg) scale(1.08)}75%{transform:rotate(-8deg) scale(1.1)}}
.flash{position:absolute;inset:0;background:#fff;animation:fl .5s ease-out forwards;z-index:2}
@keyframes fl{from{opacity:1}to{opacity:0}}
.reveal{animation:rev .6s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes rev{from{transform:scale(.2);opacity:0}}
.new{position:absolute;top:10px;left:10px;z-index:3;background:var(--coral);color:#fff;font-family:var(--display);border:2px solid var(--ink);border-radius:10px;padding:0 8px}
.chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chb{border:var(--line);border-radius:14px;padding:6px 2px;background:var(--paper);font-family:var(--display);font-size:13px;display:grid;gap:2px;justify-items:center;box-shadow:0 3px 0 var(--ink)}
.chb[aria-pressed="true"]{background:var(--yolk)}
.chb[disabled]{opacity:.45;box-shadow:none}
.path{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.path button{height:40px;border:2.5px solid var(--ink);background:#fff;border-radius:12px;font-family:var(--display);font-size:14px;padding:0}
.path button.done{background:var(--mint);color:#fff}
.path button.cur{background:var(--yolk);color:var(--ink);transform:translateY(-3px);box-shadow:0 3px 0 var(--ink)}
.path button.boss{font-size:11px}
.path button.boss:not(.done):not(.cur){background:#FFE1E1}

 daily:{day:"",attended:"",streak:0,m:{enh:0,exp:0,bat:0},claimed:false},weekly:{week:"",best:0,day:"",tries:0,claimed:false},
 nick:"",train:{atk:0,work:0,exp:0},arena:{pts:1000,best:1000,week:"",day:"",tickets:5,w:0,l:0,claimed:false,log:[]},once:{},stats:{totalGold:0,adopted:0,bestStage:-1,wins:0},lastTick:now(),nextId:2,savedAt:0}}

const petById=id=>S.pets.find(p=>p.id===id);

const petEl=p=>SP[p.sp][1];
const lvCap=p=>10*(p.stage+1);
const lvCost=lv=>Math.round(25*Math.pow(1.17,lv-1));
const TRAIN=[{k:"atk",name:"전투 훈련",desc:"모든 펫 전투력",per:.05,base:500},{k:"work",name:"일터 교육",desc:"모든 펫 일터 수익",per:.05,base:500},{k:"exp",name:"탐험 장비",desc:"원정 기본 보상",per:.10,base:800}];

const trLv=k=>(S.train&&S.train[k])||0;

const petInc=(p,wm=1)=>STAGE_GOLD[p.stage]*gradeOf2(p).m*VARS[p.v].inc*wm*SPEED*(1+((p.lv||1)-1)*.03)*(1+trLv("work")*.05);
const petPow=p=>Math.round(STAGE_POW[p.stage]*gradeOf2(p).m*VARS[p.v].pow*(1+((p.lv||1)-1)*.06)*(1+trLv("atk")*.05));
const sulking=p=>false;
const lookOf=p=>Math.min(p.look??p.stage,p.stage);
function placeName(p){if(p.work!=null)return WORKS[p.work].name;if(p.exp!=null)return EXPS[p.exp].name;return null}
function matchup(a,d,v){if(a==="star"&&d!=="star")return 1.2;if(BEATS[a]===d)return 1.5;if(BEATS[d]===a)return v==="rainbow"?1:.75;return 1}
const unitPow=(p,el)=>petPow(p)*matchup(petEl(p),el,p.v)*(p.v==="shadow"?1.2:1);
const teamPets=()=>S.team.map(petById).filter(p=>p&&p.exp==null).slice(0,3);

function advance(t){
 let dt=(t-S.lastTick)/1000;if(dt<=0){S.lastTick=t;return null}
 const offline=dt>30;dt=Math.min(dt,8*3600);
 let earned=0;const drops={awaken:0,trans:0};
 for(const p of S.pets){if(p.work==null)continue;const w=WORKS[p.work];
  let active=dt;if(p.sulk&&p.sulk>S.lastTick)active=Math.max(0,dt-Math.min(dt,(p.sulk-S.lastTick)/1000));
  earned+=petInc(p,w.mult)/60*active;
  if(w.drop){p.acc=(p.acc||0)+active;while(p.acc>=3600){p.acc-=3600;if(Math.random()<w.drop.awaken)drops.awaken++;if(Math.random()<w.drop.trans)drops.trans++}}}
 if(offline){S.pend.gold+=earned;S.pend.awaken+=drops.awaken;S.pend.trans+=drops.trans;S.pend.secs=(S.pend.secs||0)+dt}
 else{give({gold:earned,awaken:drops.awaken,trans:drops.trans});if(drops.awaken||drops.trans)toast(`일터에서 ${rewardText(drops)}을(를) 찾았어요!`)}
 S.lastTick=t;return offline?{earned,drops,dt}:null;
}

 if(teamPets().length<Math.min(3,S.pets.filter(p=>p.exp==null).length))return["전투 팀을 채워요","자동 편성으로 강한 3마리","battle"];
 const unl=Math.floor((S.cleared+1)/10);const ne=EGGS.filter(e=>e.unlock<=unl).reverse().find(e=>e.sp.some(s=>!S.codex[s])&&S.gold>=e.price);
 if(ne)return[`${ne.name}을(를) 사요`,"새 몬스터를 도감에 등록해요","shop"];
 const idle=S.pets.filter(p=>p.work==null&&p.exp==null).length,free=WORKS.reduce((t,w,i)=>t+(S.works[i]?w.slots-S.pets.filter(p=>p.work===i).length:0),0);

 if(teamPower(CH[Math.floor(g/10)].el)<recPower(g)){const tp=teamPets().find(p=>(p.lv||1)<lvCap(p)&&S.gold>=lvCost(p.lv||1));if(tp)return[`${SP[tp.sp][0]} 레벨업하기`,"전투력이 모자라요. 골드로 레벨을 올려요",`pet:${tp.id}`];if(S.gold>=trCost(TRAIN[0]))return["훈련장에서 전투 훈련","모든 펫 전투력 +5%","train"]}

}

function hatch(eggId){
 const e=S.eggs.find(x=>x.id===eggId);if(!e)return;const E=EGGS.find(x=>x.k===e.egg);
 if(S.pets.length>=MAX_PETS){toast("펫 자리가 꽉 찼어요. 주인을 찾아주면 자리가 생겨요");return}

  <div class="stage-bg" style="margin-top:10px;height:190px"><div class="eggshape egg-${e.egg} wobble" style="width:96px;height:120px"></div></div>

}
async function doHatch(e,E,I){
 if(have(I.k)<1||!S.eggs.includes(e))return;S.items[I.k]--;
 let v="normal";const roll=Math.random();let acc=0;for(const k of ["shadow","rainbow","gold"]){acc+=VARS[k].rate*I.mult;if(roll<acc){v=k;break}}
 const sp=E.sp[Math.floor(Math.random()*E.sp.length)],isNew=!S.codex[sp];
 let gi=0;{const r=Math.random()*100;let a=0;for(let i=0;i<4;i++){a+=I.odds[i];if(r<a){gi=i;break}}}
 const p={id:S.nextId++,sp,v,g:gi,stage:0,fails:0,work:null,exp:null,born:now()};
 S.pets.push(p);S.eggs=S.eggs.filter(x=>x!==e);note(p);
 if(teamPets().length<3)S.team=[...teamPets().map(x=>x.id),p.id];
 if(S.pets.filter(x=>x.work===0).length<WORKS[0].slots)p.work=0;
 markDirty();
 const m=openModal(`<div class="stage-bg" style="height:260px" id="hs"><div class="eggshape egg-${e.egg} crack" id="hegg" style="width:110px;height:138px"></div></div><div id="hres"></div>`);
 await sleep(720);const egg=$("#hegg");if(!egg)return;egg.classList.remove("crack");void egg.offsetWidth;egg.classList.add("crack");await sleep(650);
 const hs=$("#hs");if(!hs)return;
 hs.innerHTML=`<div class="flash"></div><div class="rays ${v!=="normal"?v:gi>=2?"gold":""}"></div>${isNew?'<span class="new">NEW</span>':""}<span class="grbig" style="background:${GRADES[gi].c}">${GRADES[gi].k} ${GRADES[gi].name}</span><div class="hero reveal">${sprite(sp,0,v)}</div>`;
 $("#hres").innerHTML=`<p class="bigtitle">${v!=="normal"?VARS[v].name+" ":""}${esc(SP[sp][0])}</p><p class="sub" style="text-align:center">${elBadge(SP[sp][1])} ${isNew?"도감에 새로 등록됐어요!":"태어났어요!"}<br>${GRADES[gi].name} 등급 · 수익·전투력 ×${GRADES[gi].m}${v!=="normal"?` · 변이 보너스 수익 ×${VARS[v].inc}`:""}</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn lg" data-ok>만나러 가기</button></div>`;

 render();
}
async function doEnhance(p){

 if(ok){p.stage++;p.fails=0;if((p.look??p.stage-1)===p.stage-1)p.look=p.stage;note(p);markDirty();render();

}

const CODE_CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const fmtCode=c=>c?c.slice(0,4)+"-"+c.slice(4):"";
const cleanCode=v=>(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
async function makeSaveCode(btn){
 if(!FS||!UID){toast("서버에 연결된 뒤에 만들 수 있어요");return}
 btn.disabled=true;
 try{let code=S.saveCode;
  if(!code){code=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>CODE_CH[b%CODE_CH.length]).join("")}
  S.saveCode=code;S.savedAt=now();
  await FS.doc("codes/"+code).set({uid:UID,json:JSON.stringify(S),at:now()});
  markDirty();render();toast("저장 코드에 지금 기록을 담았어요");
 }catch(e){S.saveCode=null;toast("코드를 만들지 못했어요. 잠시 뒤 다시 해 주세요");console.warn(e)}
 btn.disabled=false;
}

   <div class="statrow"><div>펫<b class="mono">${(data.pets||[]).length}</b></div><div>골드<b class="mono">${fmt(data.gold||0)}</b></div><div>도감<b class="mono">${Object.keys(data.codex||{}).length}/16</b></div></div>

  <div class="row" style="justify-content:center"><button class="btn lg" data-ok>받기</button></div>`,mm=>{mm.querySelector("[data-ok]").onclick=()=>{closeModal();collect(null)}});
}
function rescue(){if(!S.pets.length&&!S.eggs.length&&S.gold<350){S.eggs.push({id:S.nextId++,egg:"grass"});if(have("inc0")<1)S.items.inc0=1;toast("둥지가 비어서 풀숲 알을 하나 드렸어요");markDirty();render()}}
function autoWork(){
 let n=0;const idle=S.pets.filter(p=>p.work==null&&p.exp==null).sort((a,b)=>petInc(b)-petInc(a));
 for(const p of idle){let best=-1;WORKS.forEach((w,i)=>{if(S.works[i]&&p.stage>=w.min&&S.pets.filter(x=>x.work===i).length<w.slots&&(best<0||w.mult>WORKS[best].mult))best=i});if(best>=0){p.work=best;n++}}
 markDirty();render();toast(n?`${n}마리를 일터에 배치했어요`:"빈자리나 쉬는 펫이 없어요");
}
async function fight(){
 if(fighting)return;const g=selStage,ch=Math.floor(g/10),C=CH[ch],boss=g%10===9,team=teamPets();if(!team.length)return;
 const tp=teamPower(C.el),rec=recPower(g);fighting=true;S.daily.m.bat++;
 document.querySelectorAll("[data-fight],[data-stage],[data-ch]").forEach(b=>b.disabled=true);
 const win=tp*(.85+Math.random()*.3)>=rec;
 const ours=team.map((p,i)=>({el:$("#u"+i),hp:1})),fz=[...document.querySelectorAll("#foes .unit")].map(el=>({el,hp:1}));
 const turns=speed===4?2:6,wait=ms=>sleep(speed===4?50:ms/speed);
 const endOurs=win?Math.max(.15,1-rec/tp*.7):0,endFoes=win?0:Math.max(.1,1-tp/rec*.9);
 const lossOurs=(1-endOurs)*ours.length/turns,lossFoes=(1-endFoes)*fz.length/turns;
 const strike=async(att,def,amt,cls,shown)=>{
  const a=att.filter(u=>u.hp>0.001);if(!a.length||!def.some(u=>u.hp>0.001))return;
  const u=a[Math.floor(Math.random()*a.length)];u.el.classList.add(cls);await wait(180);u.el.classList.remove(cls);
  let left=amt,first=null;for(const x of def){if(left<=0)break;if(x.hp<=0.001)continue;first=first||x;const d=Math.min(x.hp,left);x.hp-=d;left-=d;
   x.el.querySelector(".hp i").style.width=Math.max(0,x.hp*100)+"%";x.el.classList.remove("hurt");void x.el.offsetWidth;x.el.classList.add("hurt");if(x.hp<=0.001)x.el.classList.add("dead")}
  if(first){const n=document.createElement("div");n.className="dmg";n.textContent=fmt(shown);first.el.appendChild(n);setTimeout(()=>n.remove(),800)}};
 for(let i=0;i<turns;i++){
  if(!$("#arena"))break;
  await strike(ours,fz,lossFoes,"lungeR",tp/turns*(.85+Math.random()*.3));await wait(240);
  if(!$("#arena"))break;
  await strike(fz,ours,lossOurs,"lungeL",rec/turns*(.85+Math.random()*.3));await wait(240);
 }
 await wait(300);fighting=false;
 if(win){const first=g>S.cleared;const r={gold:C.gold*(boss?3:1)};r[C.mat[0]]=C.mat[1];
  if(boss){if(first)Object.assign(r,C.bossFirst);else{if(Math.random()<C.rep)r.awaken=(r.awaken||0)+1;if(Math.random()<.01)r.trans=(r.trans||0)+1}}else if(Math.random()<.02)r.awaken=(r.awaken||0)+1;
  give(r);S.stats.wins++;if(first){S.cleared=g;if(g<49)selStage=g+1}markDirty();
  const sub=first&&boss?`챕터 ${ch+1} 클리어!`:`${ch+1}-${boss?"보스":g%10+1} 클리어`;
  const m=showRewards("승리!",r,sub,()=>render());
  if(g<49&&g+1<=S.cleared+1){m.querySelector("#rbtns").insertAdjacentHTML("afterbegin",`<button class="btn lg red" data-nextst>다음 스테이지</button>`);m.querySelector("[data-nextst]").onclick=()=>{closeModal();selStage=g+1;render();fight()}}
 }else{markDirty();
  openModal(`<p class="bigtitle lose">패배…</p><p class="sub" style="text-align:center">우리 팀 ${fmt(tp)} / 권장 ${fmt(rec)}<br>강화하거나 상성이 좋은 펫으로 편성해 보세요</p>
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn green" data-a="team">자동 편성</button><button class="btn" data-a="pets">강화하러 가기</button><button class="btn white" data-a="close" data-ok>닫기</button></div>`,
   m=>m.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{closeModal();if(b.dataset.a==="team"){S.team=bestTeam(C.el);markDirty();render();toast("이번 적에게 가장 강한 3마리로 편성했어요")}else if(b.dataset.a==="pets")go("pets");else render()}))}
}
async function weeklyFight(){
 if(fighting||S.weekly.tries>=3||!teamPets().length)return;fighting=true;
 const dmg=Math.round(teamPower(weekBossEl())*30*(.9+Math.random()*.2));S.weekly.tries++;const best=dmg>S.weekly.best;if(best)S.weekly.best=dmg;markDirty();lastRankWrite=0;
 openModal(`<p class="sub" style="text-align:center">주간 보스에게 준 데미지</p><p class="bigtitle mono" id="roll">0</p><p class="sub" style="text-align:center" id="rollg"></p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn lg" data-ok>확인</button></div>`,m=>m.querySelector("[data-ok]").onclick=()=>{closeModal();render()});
 const t0=performance.now();await new Promise(res=>{const step=t=>{const f=Math.min(1,(t-t0)/1100);const el=$("#roll");if(el)el.textContent=fmt(dmg*(1-Math.pow(1-f,3)));if(f<1&&el)requestAnimationFrame(step);else res()};requestAnimationFrame(step)});
 const gg=$("#rollg");if(gg)gg.textContent=`${gradeOf(dmg)[0]} 등급${best?" · 이번 주 최고 기록!":""}`;fighting=false;
}

/* ================= 이벤트 ================= */
document.addEventListener("click",e=>{
 const sc=e.target.closest("[data-scrim]");if(sc&&e.target===sc){closeModal();return}
 const t=e.target.closest("button");if(!t||t.disabled)return;const d=t.dataset;
 if(d.tab){closeModal();return go(d.tab)}
 if(t.closest(".modal"))return;
 if(d.pet)return petModal(+d.pet);
 if(d.egg)return hatch(+d.egg);
 if(d.goshop){shopTab=["awaken","trans"].includes(d.goshop)?"syn":"mat";return go("shop")}
 if(t.hasAttribute("data-collect"))return collect(e);
 if(d.goal){const g=d.goal;if(g==="egg"){const b=$("[data-egg]");b?b.scrollIntoView({behavior:"smooth",block:"center"}):go("shop")}else if(g.startsWith("pet:"))petModal(+g.slice(4));else if(g==="adv"){advTab="work";go("adv")}else if(g==="train"){advTab="train";go("adv")}else go(g);return}
 if(d.act==="attend"){if(S.daily.attended===today())return;S.daily.streak=S.daily.attended===yesterday()?S.daily.streak+1:1;S.daily.attended=today();const r={awaken:1,gold:200};if(S.daily.streak%7===0)r.trans=1;give(r);markDirty();render();return showRewards(`출석 ${S.daily.streak}일째`,r,S.daily.streak%7===0?"7일 연속 보너스!":"7일 연속 출석하면 초월석을 받아요")}
 if(d.act==="mission"){if(!missionsDone()||S.daily.claimed)return;const r={awaken:2,gold:500,trans:Math.random()<.1?1:0};give(r);S.daily.claimed=true;markDirty();render();return showRewards("미션 완료!",r)}
 if(d.psort){petSort=d.psort;return render()}
 if(d.pfilter){petFilter=d.pfilter;return render()}
 if(t.hasAttribute("data-mkcode"))return makeSaveCode(t);
 if(t.hasAttribute("data-ldcode"))return loadSaveCode();
 if(t.hasAttribute("data-copycode")){const c=fmtCode(S.saveCode);navigator.clipboard?.writeText(c).then(()=>toast("코드를 복사했어요"),()=>toast(`코드: ${c}`));return}
 if(t.hasAttribute("data-savenick")){const v=($("#nick").value||"").replace(/[<>]/g,"").trim().slice(0,12);S.nick=v;markDirty();lastRankWrite=0;writeRank();return toast(v?`닉네임을 "${v}"(으)로 정했어요`:"닉네임을 지웠어요")}
 if(d.adv){advTab=d.adv;return render()}
 if(d.bmode){bmode=d.bmode;if(bmode==="arena")refreshOpps();return render()}
 if(t.hasAttribute("data-reopp")){refreshOpps();return render()}
 if(d.duel!=null)return duel(+d.duel);
 if(t.hasAttribute("data-aclaim")){const A=S.arena;if(A.claimed||(A.w+A.l)===0)return;const T=TIERS[tierOf(A.best)];give(T[3]);A.claimed=true;markDirty();render();return showRewards(`${T[0]} 티어 보상`,T[3])}
 if(d.train){const t=TRAIN.find(x=>x.k===d.train);if(t&&trLv(t.k)<TRAIN_MAX&&pay({gold:trCost(t)})){S.train[t.k]=trLv(t.k)+1;markDirty();render();toast(`${t.name} Lv.${S.train[t.k]}!`)}return}
 if(t.hasAttribute("data-autowork"))return autoWork();
 if(d.unlock){const i=+d.unlock;if(pay({gold:WORKS[i].cost})){S.works[i]=true;markDirty();render();toast(`${WORKS[i].name}이(가) 열렸어요!`)}return}
 if(d.assign){const i=+d.assign;return pickPet(`${WORKS[i].name}에 배치`,p=>p.work==null&&p.exp==null&&p.stage>=WORKS[i].min,p=>{p.work=i;closeModal();markDirty();render()},p=>`초당 ${fmtS(petInc(p,WORKS[i].mult)/60)}`)}
 if(d.sendexp){const i=+d.sendexp,x=EXPS[i];return pickPet(`${x.name}에 보낼 펫`,p=>p.exp==null&&p.stage>=x.min,p=>{p.work=null;p.exp=i;S.team=S.team.filter(id=>id!==p.id);S.exps[i]={pet:p.id,until:now()+x.mins*60000};S.daily.m.exp++;closeModal();markDirty();render();toast(`${SP[p.sp][0]}이(가) ${x.name}(으)로 떠났어요`)})}
 if(d.claimexp){const i=+d.claimexp,x=EXPS[i],ex=S.exps[i];if(!ex||ex.until>now())return;const r={};r[x.base[0]]=Math.round(rnd(x.base[1],x.base[2])*(1+trLv("exp")*.10));if(Math.random()<x.bonus[1])r[x.bonus[0]]=(r[x.bonus[0]]||0)+1;if(x.extra&&Math.random()<x.extra[1])r[x.extra[0]]=(r[x.extra[0]]||0)+1;give(r);const p=petById(ex.pet);if(p)p.exp=null;delete S.exps[i];markDirty();render();return showRewards(`${x.name} 귀환`,r,p?`${SP[p.sp][0]}이(가) 돌아왔어요`:"")}
 if(d.teamslot!=null){const i=+d.teamslot,el=CH[Math.floor(selStage/10)].el;return pickPet("전투 팀에 넣을 펫",p=>p.exp==null,p=>{const cur=teamPets().map(x=>x.id);const at=cur.indexOf(p.id);if(at>=0)cur.splice(at,1);if(i<cur.length)cur[i]=p.id;else cur.push(p.id);S.team=cur.slice(0,3);closeModal();markDirty();render()},p=>`이번 적에게 ${fmt(unitPow(p,el))}`)}
 if(t.hasAttribute("data-autoteam")){S.team=bestTeam(CH[Math.floor(selStage/10)].el);markDirty();render();return toast("이번 적에게 가장 강한 3마리로 편성했어요")}
 if(d.ch){selStage=Math.min(+d.ch*10,S.cleared+1);return render()}
 if(d.stage){selStage=+d.stage;return render()}
 if(d.speed){speed=+d.speed;return render()}
 if(t.hasAttribute("data-fight"))return fight();
 if(t.hasAttribute("data-wboss"))return weeklyFight();
 if(t.hasAttribute("data-wclaim")){if(S.weekly.claimed||!S.weekly.best)return;const g=gradeOf(S.weekly.best);give(g[2]);S.weekly.claimed=true;markDirty();render();return showRewards(`${g[0]} 등급 보상`,g[2])}
 if(d.shop){shopTab=d.shop;return render()}
 if(d.buyegg){const E=EGGS[+d.buyegg];if(pay({gold:E.price})){S.eggs.push({id:S.nextId++,egg:E.k});markDirty();render();toast(`${E.name}을(를) 샀어요. 홈의 알 둥지에서 부화시켜요`)}return}
 if(d.buy){const k=d.buy,n=+d.n;if(pay({gold:PRICE[k]*n})){give({[k]:n});markDirty();render();toast(`${ITEMS[k][0]} ${n}개를 샀어요`)}return}
 if(t.hasAttribute("data-synth")){if(pay({awaken:8})){give({trans:1});markDirty();render();showRewards("합성 성공",{trans:1})}return}
 if(d.codex)return codexModal(d.codex);
 if(d.once){const o=ONCE.find(x=>x[0]===d.once);if(o&&!S.once[o[0]]&&o[3](S)){S.once[o[0]]=true;give(o[2]);markDirty();render();showRewards(o[1],o[2])}return}
 if(d.rsort){rankSort=d.rsort;const b=$("#rankBox");if(b)b.innerHTML=rankTable();document.querySelectorAll("[data-rsort]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.rsort===rankSort));return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!fighting)closeModal()});

/* ================= 시작 ================= */
function boot(saved){
 if(saved)S=migrate(saved);
 advance(now());rollDay();render();setTimeout(offlineModal,400);
 setInterval(()=>{const off=advance(now());tickLive();if(off)offlineModal();const b=badges();document.querySelectorAll("#nav [data-tab],#topbtns [data-tab]").forEach(el=>{const has=!!b[el.dataset.tab],dot=el.querySelector(".dot");if(has&&!dot)el.insertAdjacentHTML("beforeend",'<span class="dot"></span>');if(!has&&dot)dot.remove()})},1000);
 setInterval(saveLocal,15000);setInterval(()=>{if(dirty)flush()},8000);
 document.addEventListener("visibilitychange",()=>{if(document.hidden){S.savedAt=now();saveLocal();dirty=true;flush()}});
}
boot(loadLocal());
(async()=>{
 const cfg=window.FIREBASE_CONFIG;
 if(!window.firebase||!cfg||!cfg.apiKey||cfg.apiKey.startsWith("여기")){console.warn("Firebase 설정이 없어 이 기기에만 저장해요");return}
 try{
  firebase.initializeApp(cfg);const auth=firebase.auth(),fs=firebase.firestore();
  if(!auth.currentUser)await auth.signInAnonymously();
  const uid=auth.currentUser.uid;
  // 게임 코드가 쓰는 모양에 맞춘 얇은 연결층
  const db={doc:p=>({get:()=>fs.doc(p).get().then(x=>({exists:x.exists,data:()=>x.data()})),set:d=>fs.doc(p).set(d)}),
   collection:p=>({onSnapshot:(next,err)=>fs.collection(p).onSnapshot(q=>next({docs:q.docs.map(x=>({id:x.id,data:()=>x.data()}))}),err)})};
  DB=db;FS=fs;UID=uid;dbWritable=true;
  const snap=await db.doc("data/users/"+uid+"/save").get();
  if(snap.exists){const d=snap.data();if(d&&d.json&&(d.savedAt||0)>(S.savedAt||0)){try{S=migrate(JSON.parse(d.json));advance(now());render();toast("저장된 기록을 불러왔어요");offlineModal()}catch(e){}}}
  dirty=true;await flush();
  db.collection("arena").onSnapshot(q=>{arenaRows=q.docs.map(x=>({id:x.id,...x.data()}));arenaRows.forEach(r=>{if(r.name)rankNames[r.id]=r.name});if(tab==="battle"&&bmode==="arena"&&!$("#modalRoot").innerHTML)render()},e=>console.warn(e));
  db.collection("ranks").onSnapshot(q=>{rankRows=q.docs.map(x=>({id:x.id,...x.data()}));rankRows.forEach(r=>{if(r.name)rankNames[r.id]=r.name});const b=$("#rankBox");if(b)b.innerHTML=rankTable()},e=>console.warn(e));
  writeRank();
 }catch(e){console.warn("Firebase 연결 실패",e)}
})();
</script>
